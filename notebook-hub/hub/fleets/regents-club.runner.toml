# The Regents Club's copy of fly.runner.toml (fleet id regents_club), filled in 13 Oct 2026.
# The app is created on the fleet's own private network (kf-nb-regents-club-net), so its
# machines can reach only the fleet's hub and each other, never the shared database
# or other Regent apps. It holds only the runner image and the machines the hub
# starts through the Fly Machines API, one per notebook session. Nothing is deployed
# to it and it has no services or public IP: machines stop when their session ends
# (or at their lifetime cap) and Fly then deletes them.
app = "kf-nbk-regents-club"
primary_region = "iad"
