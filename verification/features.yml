      - route: GET /account
      - live: KeyfleetWeb.ShellLive
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/test/keyfleet_web/shell_live_test.exs
      - platform/test/keyfleet_web/home_live_test.exs
      - platform/test/keyfleet_web/menu_agents_test.exs
      - platform/test/keyfleet_web/agent_pictures_test.exs
      - platform/test/browser/account_menu.spec.ts
