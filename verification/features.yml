      - platform/lib/keyfleet/graph/projectors.ex
      - platform/lib/keyfleet/graph/supervisor.ex
      - scripts/deploy.sh
      - scripts/release.sh
    entry:
      - route: GET /healthz
    proofs:
      - platform/test/keyfleet/graph/cluster_test.exs
      - platform/test/keyfleet/graph/writer_test.exs
      - platform/test/keyfleet/runtime_config_test.exs
      - scripts/release.sh
    gaps:
      - The two-step release was tried on a throwaway Fly app with a stand-in server, not yet on keyfleet.ai.
      - For the minute a site release takes, two site machines run, so announcements from other Regent sites reach open pages twice.

  - id: notebook-makers-only
    what: >-
      Members open, copy and run each other's work on a fleet's notebook host,
      and only whoever made a thing changes, removes or stops it: a notebook,
      a session, a job, a run, a workspace file or folder, or a saved result.
      Anyone else is refused and nothing changes. Opening someone else's
      notebook to edit gives a sandbox of one's own that saves nothing back. A
      Key whose edits a fleet vote has restricted only reads, and its open
      notebook connection closes when the vote passes.
    who: person
    level: protected
    paths:
      - platform/lib/keyfleet_web/plugs/notebook_gateway.ex
      - platform/lib/keyfleet_web/notebook_socket.ex
      - platform/lib/keyfleet/notebooks/makers.ex
