\* Writes without the pairing lock: two people, re-pairing, both surfaces, every wallet kind.
\* NoWriteAfterUnpair breaks here (finding F1); run.sh checks it on its own.
CONSTANTS
  People = {"p1", "p2"}
  MaxEpisodes = 2
  Surfaces = {"signed", "mcp"}
  Wallets = {"eoa_base", "eoa_eth", "smart_base", "smart_eth"}
  UseLock = FALSE
  Broken = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoWriteWithoutPairing
INVARIANT SmartWalletOnlyOnBase
INVARIANT CodeSingleUse
INVARIANT NoFormerPersonDataInAnswer
PROPERTY OnePairingAtATime
