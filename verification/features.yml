  - id: theme-switch
    what: >-
      A visitor turns the page light or dark with one switch named Light
      theme, on for light, by pointer, a drag of its knob, Space or Enter;
      each press turns it once. Signed in it is a row of the account menu;
      signed out it sits in the header of the homepage and the app's pages,
      and in the footer of the reading pages. A page shows one. Every page is
      light until a theme is chosen, and the choice holds over a reload and a
      live page change. Where the browser can, a glass knob with a moon and
      sun of tiny blocks is drawn on a canvas; otherwise, and under reduced
      motion or forced colours, the flat square switch works alone.
