# Cascade #1's copy of fly.hub.toml (fleet id fibonacci_cascade), filled in 23 Oct 2026 from Classic #1's.
# The app is created on the fleet's own private network (kf-nb-fibonacci-cascade-net, shared
# only with kf-nbk-fibonacci-cascade) and gets no public IP (deploy with --no-public-ips).
# Keyfleet reaches it only through a Flycast address made for keyfleet's network,
# http://kf-nb-fibonacci-cascade.flycast, which the service below answers on.
# Secrets (see hub.env.example) are set with `fly secrets set`, never here.
app = "kf-nb-fibonacci-cascade"
primary_region = "iad"

[build]
  image = "registry.fly.io/kf-nb-fibonacci-cascade:626ec14-7130fe0"

[env]
  MARIMOHUB_RUN_MAINTENANCE = "true"
  MARIMOHUB_JOBS = "on"
  MARIMOHUB_SANDBOX_AUTH = "on"
  MARIMOHUB_AUTH_BACKEND = "proxy-header"
  MARIMOHUB_AUTH_PROXY_HEADER = "X-Keyfleet-Assertion"
  MARIMOHUB_AUTH_PROXY_JWT_ISSUER = "https://keyfleet.ai"
  MARIMOHUB_AUTH_PROXY_JWT_AUDIENCE = "keyfleet-hub:fibonacci_cascade"
  MARIMOHUB_AUTH_PROXY_JWKS_URL = "https://keyfleet.ai/.well-known/hub-jwks.json"
  MARIMOHUB_AUTH_ALLOWED_EMAIL_DOMAINS = "identity.keyfleet.invalid"
  MARIMOHUB_APP_BASE_URL = "https://fibonacci-cascade.notebooks.keyfleet.ai"
  MARIMOHUB_DEFAULT_ROLE = "none"
  MARIMOHUB_PROJECT_CREATION = "restricted"
  MARIMOHUB_SUPER_ADMINS = "kf_provisioner_fibonacci_cascade@identity.keyfleet.invalid"
  MARIMOHUB_SANDBOX_PROXY_ACK_UNTRUSTED = "true"
  MARIMOHUB_PERSIST_WORKSPACE = "workspace"
  MARIMOHUB_SESSION_MAX_LIFETIME_SECONDS = "14400"
  MARIMOHUB_SESSION_IDLE_TIMEOUT_SECONDS = "900"
  MARIMOHUB_EDITOR_SANDBOX_SHARING = "exclusive"
  MARIMOHUB_JOBS_MAX_PER_NOTEBOOK = "100"
  MARIMOHUB_INTEGRATIONS = "off"
  MARIMOHUB_STORAGE_BACKEND = "s3"
  MARIMOHUB_STORAGE_S3_ENDPOINT = "https://fly.storage.tigris.dev"
  MARIMOHUB_STORAGE_S3_REGION = "auto"
  MARIMOHUB_STORAGE_S3_BUCKET = "kf-nb-fibonacci-cascade"
  MARIMOHUB_COMPUTE_IMAGE = "registry.fly.io/kf-nbk-fibonacci-cascade:626ec14"
  MARIMOHUB_COMPUTE_FLY_API_URL = "http://_api.internal:4280"
  MARIMOHUB_COMPUTE_FLY_APP = "kf-nbk-fibonacci-cascade"
  MARIMOHUB_COMPUTE_FLY_REGION = "iad"
  MARIMOHUB_COMPUTE_FLY_CPU_KIND = "shared"
  MARIMOHUB_COMPUTE_FLY_CPUS = "2"
  MARIMOHUB_COMPUTE_FLY_MEMORY_MB = "2048"
  MARIMOHUB_COMPUTE_FLY_OWNER = "kf-nb-fibonacci-cascade"

# Flycast traffic arrives through this service. It is private because the app has
# no public IP. The one machine always runs: it also cleans up expired sessions.
[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# One machine: the hub keeps its catalog in one bucket and runs one maintenance loop.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
