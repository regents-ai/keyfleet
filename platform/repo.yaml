version: 1
repo: keyfleet
owner: keyfleet
path: keyfleet/platform
owns:
  - web_app
  - web_routes
  - human_identity
  - public_api_serving
source_of_truth:
  repo_contract: repo.yaml
  http_contracts:
    - id: keyfleet_api
      owner: keyfleet
      path: contracts/api-contract.openapiv3.yaml
      served_copy: priv/static/api-contract.openapiv3.yaml
  cli_contracts: []
  runtime_contracts: []
  chain_contracts: []
code_map:
  - id: endpoint
    path: lib/keyfleet_web/endpoint.ex
  - id: routes
    path: lib/keyfleet_web/router.ex
  - id: accounts
    path: lib/keyfleet/accounts.ex
domain_interfaces:
  - id: accounts
    owner: keyfleet
    path: lib/keyfleet/accounts.ex
local_path_dependencies:
  - id: regent_privy
    path: ../../elixir-utils/privy
  - id: regent_identity
    path: ../../regents/identity
  - id: regent_ui
    path: ../../design-system/regent_ui
  - id: regent_agent_access
    path: ../../elixir-utils/agent_access
  - id: credo_ash
    path: ../../elixir-utils/credo_ash
acceptance_commands:
  - cwd: platform
    command: mix precommit
  - cwd: platform
    command: npm run typecheck
  - cwd: platform
    command: npm test
