# One fleet's notebook runner app. Copy per fleet and replace <fleet> and <region>.
# This app holds only the runner image and the machines the hub starts through
# the Fly Machines API, one per notebook session. Nothing is deployed to it and
# it has no services or public IP: machines are private, stop when their
# session ends (or at their lifetime cap) and Fly then deletes them.
app = "kf-nbk-<fleet>"
primary_region = "<region>"
