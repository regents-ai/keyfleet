          type: integer
          minimum: 1
          maximum: 9223372036854775807
          description: Which owner of the key the pairing was made under; it goes up each time the key changes hands
        owner_wallet: {$ref: "#/components/schemas/AgentWallet"}
        operator_wallet: {$ref: "#/components/schemas/AgentWallet"}
