      - platform/test/keyfleet_web/live/proposals_page_test.exs
    gaps:
      - The lists come from the votes and presence records read from the chain; they can trail the contract's figures above them by the reader's last blocks.
      - Checked by eye in headless Chromium at 1280 and 390, light and dark; WebKit is not run on the Mac.

  - id: agent-proposal-key-votes
    what: >-
      An agent reading a proposal (browser tool proposals_show, /mcp, the
      signed route, the CLI's proposals read) gets ballots, the same Yes, No,
      Abstain and Not voted Key lists the proposal's page shows.
    who: agent
    level: ordinary
    paths:
