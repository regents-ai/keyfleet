      - platform/test/keyfleet_web/agent_notebook_files_test.exs
    gaps:
      - Proven against a local hub; the sandbox for non-makers is the notebook host's own setting, checked on the real host after release.
      - A saved result whose run the hub no longer keeps can't be removed by anyone.
      - Files a run writes have no maker kept, so they are the notebook's maker's.

