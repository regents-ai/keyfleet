      - platform/test/browser/key_shards.spec.ts
    regressions:
      - id: R-20261117-press-after-reconnect
        from: Keyfleet chief's review of d193a8183, 17 November 2026
        test: platform/test/browser/wallet_buttons.spec.ts
      - id: R-20261117-agent-hears-press-note
        from: Keyfleet chief's second review of kf/wallet-press-1118, 17 November 2026
        test: platform/test/browser/wallet_buttons.spec.ts
      - id: R-20261117-offline-press-never-nothing-sent
        from: Keyfleet chief's question at the merge of the homepage release into kf/wallet-press-1118, 17 November 2026
        test: platform/test/browser/wallet_buttons.spec.ts
      - id: R-20261117-agent-answered-at-once
        from: Keyfleet chief's third review of kf/wallet-press-1118 (fe425e59a), 17 November 2026
        test: platform/assets/test/onchain_steps.test.ts
      - id: R-20261117-ask-names-open-wallet
        from: Keyfleet chief's second review of kf/wallet-press-1118, fixed as ash-template d60a9b31 fixed it, 17 November 2026
        test: platform/test/browser/key_shards.spec.ts
      - id: R-20261118-refusal-one-note
        from: Keyfleet chief's fourth review of kf/wallet-press-1118, 18 November 2026
        test: platform/test/browser/wallet_buttons.spec.ts
      - id: R-20261118-press-wallet-at-press
        from: Keyfleet chief's fourth review of kf/wallet-press-1118, fixed as ash-template ef4074c4 fixed it, 18 November 2026
        test: platform/assets/test/onchain_steps.test.ts
    gaps:
      - Following a press across a reconnect waits on Sean's decision. A press made while the page is still getting its connection back, from the steps the page already holds, reaches the wallet but is shown as not this page's step. In the Buy Key window, which the page closes when it comes back, such a press is not shown at all, and one that asks for its steps then (its form changed, or it held none) sends nothing; the ask names the window by the page's numbering from before, which the fresh page doesn't have.
      - A browser agent's press that asks the server for its steps never answers the agent if the page moves to another page before the steps come back.
      - When the connection drops while a press asks for its steps, the browser agent waits about 30 seconds after the page is back, then hears the page lost its connection.
      - Offline, a press that sends nothing answers the browser agent in the right words, but the person sees no note beside the button, as the report can't reach the server.
      - Two presses that fail close together leave one note beside the buttons, the later one's.
      - Signed out, a browser agent's press leaves "Sign in to send this. Nothing was sent." beside the button, while the agent hears that the wallet app has no wallet open.
      - The browser agent hears "Sent" for any hash the wallet returns, before the server checks it. A hash the page then marks as not this page's step, such as one from held steps sent by a wallet that ignores the steps' sender, is still "Sent" to the agent.
      - A press made just before the person lets the wallet go still reaches that wallet when its steps arrive. If the wallet then refuses, the page and the browser agent both say the wallet may have sent it, though nothing was sent.
      - A press from steps the page already holds, made as another wallet opens, goes through the new wallet with the old wallet's address as sender. A wallet that refuses that is reported to the person and the agent as "may have sent", though nothing was sent.
      - A person's own press that the server refuses, followed at once by a wallet switch, leaves no note beside the buttons. Nothing was sent and the button still works.
      - The visit log records a press the server refused to build steps for as "ok", with no line for the refusal. The failure count is right.
      - A wallet app that never answers holds the press, and a browser agent's call, open without end. A second press still reaches the wallet.
      - The lost-connection line disappears at the page's next redraw.
      - A claim made, then the page left and come back to, is not followed on the page.
      - The wallet panel handles no report of a signature step. No Keyfleet page builds one today.
      - The walks press from another network with a stand-in wallet whose switch stands in for Privy's; a real switch in Coinbase Wallet, Rabby, Zerion or MetaMask on a phone is checked by hand on keyfleet.ai after release.
      - The anvil lab's network, which Privy does not list, reaches Privy with the site's own name and node (a unit test checks this); the lab needs a real Privy sign-in, so it is not walked end to end, and it has not been tried by hand since this change.
      - WebKit is not run on the Mac.
