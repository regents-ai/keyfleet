[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [
  { access = "read", path = "./deployments" },
  { access = "write", path = "./deployments/anvil.deployed.json" },
  { access = "write", path = "./deployments/base.deployed.json" },
  { access = "write", path = "./deployments/safe" },
  { access = "read", path = "./broadcast/DeployKeyfleets.s.sol" },
  { access = "read", path = "../platform/test/support/fixtures/trait_tables/0x1249d615f793a311bcb27def92766224fb544df85aa74359a785a6349df18610.json" },
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

# Runs the collection invariant suites at the design's 256 runs × depth 100, set inline in each
# suite, which the default profile shortens for everyday runs:
#   FOUNDRY_PROFILE=deep forge test --match-path test/invariant/KeyfleetCollectionInvariant.t.sol
[profile.deep]

[fmt]
ignore = ["src/vendor/**"]
