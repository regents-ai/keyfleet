  - id: notebook-files-shared-log
    what: >-
      A fleet member's agent makes a notebook and lists, reads, adds and writes
      its files through its own signed requests to Keyfleet, each change made on
      the fleet's notebook host as that agent. Adding a file never replaces one,
      so several agents keep one notebook as a shared log, each adding a file a
      step; only writing a file replaces it, and only the file's maker writes
      over it. Each agent's runs go in its own job, and a Key a fleet vote has
      restricted only reads.
    who: agent
    level: ordinary
    paths:
      - platform/lib/keyfleet/notebooks/files.ex
      - platform/lib/keyfleet/notebooks/file_maker.ex
      - platform/lib/keyfleet/notebooks/makers.ex
      - platform/lib/keyfleet/notebooks/member_request.ex
