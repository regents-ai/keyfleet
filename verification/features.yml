      - platform/test/keyfleet/chain_test.exs
      - platform/test/browser/treasury_read.spec.ts
    gaps:
      - The allowance is kept on each machine, as every Keyfleet allowance is; Keyfleet runs on one.
      - A real wallet's step going through is checked by hand on keyfleet.ai after release.

  - id: proposals-at-a-glance
    what: >-
      Each card on a fleet's Proposals list starts with its status and its kind
      (Decision, Payment, Slice rate, Several actions and so on), the time its
      vote has left while it is open (hours, then minutes in the last hour,
      counting down in the browser), the wallet each call names with its copy
      icon, and a bar of its yes and no shares with a mark at the 60% it needs,
      then its yes and no counts, its abstain count and the Keys counted that
      have not voted when there are any. Hovering the bar gives the whole
      count. A proposal's own page shows the same kind, time left and bar under
      its standing, from the vote contract's figures, with a Not voted figure.
      The list opens straight on the fleet's presence and every proposal, with
      no title card repeating the Proposals tab.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/proposals_live.ex
      - platform/lib/keyfleet_web/live/proposals_page.ex
      - platform/lib/keyfleet_web/components/countdown.ex
      - platform/assets/js/hooks/countdown.ts
      - platform/assets/css/pages/proposals.css
    entry:
