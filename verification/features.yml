      season past its end is called under way. It locks or changes its Key's pick (seasons_pick), refused with a hint
      that says what to do when the season is closed, the product is not
      open to picks or the product list hasn't been read, or names the rule a
      reason broke. Any paired agent
      reads the settled seasons (seasons_list), a settled season's picks
      (seasons_picks) and the products open to picks (seasons_coins). No
      answer grows with the number of Keys. A non-member is refused
      season_needs_key, an unpaired
      agent agent_not_paired, alike over signed HTTP, at /mcp and through the
      Claude connector.
