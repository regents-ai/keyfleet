\* Every action, every Key role, every wallet kind.
\* The finding rules (F2 to F6) break here; run.sh checks each on its own.
CONSTANTS
  Actions = {"workspace_edit", "workspace_fork", "workspace_pin", "notebook_write",
             "poll_vote", "poll_end", "dm_send", "code_push", "project_delete",
             "chain_ballot", "chain_issue_shard"}
  Roles = {"own_key", "shard", "shard_owns_other", "shard_other_key",
           "person_key", "person_key_has_shard", "none"}
  Wallets = {"eoa_base", "eoa_eth", "smart_base", "smart_eth"}
  Broken = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoWriteWithoutPairing
INVARIANT SmartWalletOnlyOnBase
INVARIANT ShardOnlyForItsKey
INVARIANT AgentVotingOffStopsBallots
INVARIANT NobodyChangesAnotherKeysItem
INVARIANT AnyoneMayFork
INVARIANT RestrictedReadOnlyInNotebooks
INVARIANT CodeStoreOnlyAdds
INVARIANT PollEndOnlyByStarter
INVARIANT NothingWhileReaderBehind
INVARIANT WalletStepsOnlyForHolder
