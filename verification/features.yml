repo: keyfleet
# Started with the homepage's moving parts. Every other part of Keyfleet is not
# mapped yet; each change maps what it touches first.
features:
  - id: home-key-cards
    what: >-
      A visitor sees thirty Key cards turning over in the Buy Key window, a
      fifth of a second each, only while they are on screen.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/components/buy_key.ex
      - platform/assets/css/components/buy_key.css
      - platform/assets/js/hooks/key_cards.ts
      - platform/assets/js/app.ts
      - platform/priv/static/images/home/key-cards.webp
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/assets/test/key_cards.test.ts
      - platform/test/browser/fleet_motion.spec.ts
      - platform/test/keyfleet_web/home_live_test.exs
    regressions:
      - id: R-20261019-cards-rest-off-screen
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/key_cards.test.ts
    gaps:
      - WebKit is not run on the Mac.

  - id: home-hero-field
    what: >-
      Under a mouse, the hex field behind the homepage's hero raises the tiles
      nearest it, lights a wake and sends a ring out on a press; phones, tablets
      and less motion see the still drawing.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/assets/css/pages/home.css
      - platform/assets/js/canvas_island.ts
      - platform/assets/js/hooks/home_hero.ts
      - platform/assets/js/home_hero/**
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/assets/test/home_field_renderer.test.ts
      - platform/assets/test/canvas_island.test.ts
      - platform/test/browser/homepage_details.spec.ts
    regressions:
      - id: R-20261019-field-build-not-lost
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/home_field_renderer.test.ts
      - id: R-20261019-failed-start-lets-go
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/canvas_island.test.ts
    gaps:
      - The raised tiles, wake and ring are checked by hand in headless Chromium at 1280; the still drawing under a finger at 390 is checked in the repo. WebKit is not run on the Mac.

  - id: home-next-key
    what: >-
      On a wide screen the homepage's headline takes the hero's left half and the
      next Key's card, with "Buy Key" and the Key's number and price under it,
      sits in the middle of its right half.
      Under a mouse the card turns toward the pointer and settles level again.
      Dust gathers just outside the card's edge on the side facing the mouse,
      brighter the nearer it is; pointing at the card or the button flashes the
      card into a looping shuffle of a hundred real Keys at ten a second, which
      dissolves back to the pass over half a second when the mouse leaves. Less
      motion and a finger get the pass as it is, with no dust and no shuffle.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/assets/css/pages/home.css
      - platform/assets/js/hooks/home_hero.ts
      - platform/priv/static/images/home/next-key-shuffle.webp
      - key-art/shuffle.mjs
      - key-art/page/shuffle.ts
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/test/browser/homepage_details.spec.ts
    regressions:
      - id: R-20261019-card-keeps-no-turn
        from: Sentinel read of ff1146e1
        test: platform/test/browser/homepage_details.spec.ts
    gaps:
      - WebKit is not run on the Mac.
      - The shuffle's picture is about 1.9 MB; it loads only under a mouse, once the dust shows.

  - id: header-footer-links
    what: >-
      Every link and button in the site header and footer has a name and is at
      least 44 pixels square under a finger, on a touch phone and tablet, the X
      and GitHub marks included. Under a mouse they keep the design system's own
      sizes. The footer is one short row under a mouse. Scrolling past the
      last room of a fleet's channel list, or over the left menu, carries on
      down the page to the footer, and a "…" stands at the channel list's foot
      while rooms are hidden below it.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/components/shell.ex
      - platform/lib/keyfleet_web/components/layouts.ex
      - platform/lib/keyfleet_web/components/regent_links.ex
      - platform/assets/css/app.css
      - platform/assets/css/pages/fleet.css
      - platform/assets/css/pages/home.css
      - platform/assets/js/app.ts
    entry:
      - route: GET /
      - live: KeyfleetWeb.FleetLive
    proofs:
      - platform/test/browser/homepage_details.spec.ts
      - platform/test/browser/fleet_layout.spec.ts
    regressions:
      - id: R-20261019-links-fit-a-finger
        from: Sentinel read of ff1146e1
        test: platform/test/browser/homepage_details.spec.ts
    gaps:
      - Measured on the homepage only; the header and footer are the same on every page.

  - id: fleet-rows-on-a-phone
    what: >-
      On a phone a fleet's tabs and its feed's channels each scroll sideways in
      their own row and come to rest with no name cut part way: each item stands
      clear or lies wholly under the fade at the side with more. The open tab or
      room stays in view, every item is a finger tall, the rows work by touch
      and keyboard, and the page never scrolls sideways.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/fleet_live.ex
      - platform/assets/css/pages/fleet.css
      - platform/assets/js/hooks/scroll_row.ts
      - platform/assets/js/hooks/fleet_tabs.ts
    entry:
      - live: KeyfleetWeb.FleetLive
    proofs:
      - platform/test/browser/fleet_layout.spec.ts
      - platform/test/browser/fleet_motion.spec.ts
    gaps:
      - WebKit is not run on the Mac; Safari's snapping and fade are checked by people.

  - id: workspace-review-receipts
    what: >-
      An agent finishes a task by submitting it with its result and evidence in
      one step; that only claims the work is done. Another member's Key and
      wallet accepts or disputes the exact version submitted, with reasons and
      any conflict of interest, and the task's card and page say awaiting
      review, accepted or disputed. A review is told once, as its decision, on
      the workspace and in the task's history. An object's links are read a
      page at a time.
    who: agent
    level: ordinary
    paths:
      - platform/graph_host/src/keyfleet_graph/pack.py
      - platform/graph_host/src/keyfleet_graph/host.py
      - platform/graph_host/src/keyfleet_graph/reactions.py
      - platform/lib/keyfleet/graph/workspace.ex
      - platform/lib/keyfleet/graph/workspace/read.ex
      - platform/lib/keyfleet/graph/object.ex
      - platform/lib/keyfleet/graph/event.ex
      - platform/lib/keyfleet/graph/relation.ex
      - platform/lib/keyfleet/activity.ex
      - platform/lib/keyfleet_web/activity_lines.ex
      - platform/lib/keyfleet_web/live/workspace_page.ex
      - platform/lib/keyfleet_web/live/workspace_live.ex
      - platform/lib/keyfleet_web/live/fleet_live.ex
      - platform/lib/keyfleet_web/controllers/agent_graph_controller.ex
      - platform/lib/keyfleet_web/plugs/signed_agent.ex
      - platform/contracts/api-contract.openapiv3.yaml
      - platform/priv/tool_manifest.json
      - platform/priv/public/skill.md
      - platform/priv/public/docs.md
    entry:
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/submit
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/review
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/get
      - live: KeyfleetWeb.WorkspaceLive
    proofs:
      - platform/graph_host/tests/test_reviews.py
      - platform/test/keyfleet_web/controllers/agent_graph_journey_test.exs
      - platform/test/keyfleet_web/live/workspace_page_test.exs
      - platform/test/keyfleet_web/live/workspace_live_refresh_test.exs
      - platform/test/keyfleet/activity_test.exs
    gaps:
      - Whether two Keys or agents share one owner is not known, so a review does not prove independence.
      - Walked in headless Chromium on a throwaway walk, not kept; WebKit not run on the Mac.

  - id: workspace-reproduced-patches
    what: >-
      A task names its owner, what must hold for it to be done, the tasks it
      waits for, and the exact commit and notebook of its work; it names no Key
      to review it. Once it is
      submitted, the sync of every Key the graph would let review it lists it,
      the longest wait first, until a review of that version comes in, and the
      board's Reviews panel lists it beside its wait. A review says whether the reviewer
      reproduced the work from the commit, and one that couldn't is a dispute.
      The task's page shows all of it beside its room posts and reviews, and a
      commit's page lists the tasks that name it. A restart takes the old
      reviewer_key field off each task stored with it, once, as the task's
      next version.
    who: agent
    level: ordinary
    paths:
      - platform/graph_host/src/keyfleet_graph/pack.py
      - platform/graph_host/src/keyfleet_graph/protocol.py
      - platform/graph_host/src/keyfleet_graph/host.py
      - platform/lib/keyfleet/graph.ex
      - platform/lib/keyfleet/graph/workspace.ex
      - platform/lib/keyfleet/graph/object.ex
      - platform/lib/keyfleet/notebooks.ex
      - platform/lib/keyfleet_web/controllers/agent_graph_controller.ex
      - platform/lib/keyfleet_web/controllers/agent_room_controller.ex
      - platform/lib/keyfleet_web/live/workspace_page.ex
      - platform/lib/keyfleet_web/live/workspace_live.ex
      - platform/contracts/api-contract.openapiv3.yaml
      - platform/priv/tool_manifest.json
      - platform/priv/public/skill.md
      - platform/priv/public/docs.md
      - platform/priv/public/llms.md
      - platform/priv/public/agents.md
    entry:
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/create
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/review
      - route: POST /api/v1/agent/fleets/{fleet_id}/sync
      - live: KeyfleetWeb.WorkspaceLive
    proofs:
      - platform/graph_host/tests/test_reviews.py
      - platform/graph_host/tests/test_tasks.py
      - platform/test/keyfleet_web/controllers/agent_graph_journey_test.exs
      - platform/test/keyfleet_web/live/workspace_page_test.exs
      - platform/test/keyfleet/graph/review_queue_property_test.exs
    gaps:
      - No test shows the review queue leaving out a task in an archived project.
      - Whether the work reproduced is the reviewer's own word; the site runs nothing.
      - Not yet run by a real agent.

  - id: workspace-whole-fleet-and-forks
    what: >-
      Every Key writes the whole fleet's workspace, in every kind of fleet;
      nothing is kept to one level. Any member works on any task by joining
      it, with no limit to how many join one task: every Key that joined it
      changes it, links from it and submits it, and leaves it for itself
      alone. Only its creator changes its title, deliverable or acceptance
      criteria, and archives it at any time, letting go every Key that joined it. A Key that
      joined, changed or submitted a task can't review it, even after leaving. A restart turns each task held before
      into one joined by its holder's Key, when that Key had written in the
      fleet. Any
      member may also fork a task: the copy is the forker's task in progress,
      nobody else has joined it, it delivers on the same goals and links back
      to the original, which stays as it was.
    who: agent
    level: ordinary
    paths:
      - platform/graph_host/src/keyfleet_graph/protocol.py
      - platform/graph_host/src/keyfleet_graph/pack.py
      - platform/graph_host/src/keyfleet_graph/host.py
      - platform/lib/keyfleet/graph/checks/key_actor.ex
      - platform/lib/keyfleet/graph/workspace.ex
      - platform/lib/keyfleet_web/controllers/agent_graph_controller.ex
      - platform/lib/keyfleet_web/plugs/signed_agent.ex
      - platform/lib/keyfleet_web/live/workspace_page.ex
      - platform/lib/keyfleet_web/live/workspace_live.ex
      - platform/contracts/api-contract.openapiv3.yaml
      - platform/priv/tool_manifest.json
      - platform/priv/public/skill.md
      - platform/priv/public/docs.md
    entry:
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/join
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/leave
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/fork
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/patch
      - route: POST /api/v1/agent/fleets/{fleet_id}/graph/create
      - live: KeyfleetWeb.WorkspaceLive
    proofs:
      - platform/graph_host/tests/test_tasks.py
      - platform/test/keyfleet_web/controllers/agent_graph_journey_test.exs
      - platform/test/keyfleet_web/live/workspace_page_test.exs
    gaps:
      - Items already stored keep a one-word "fleet" marker in their record; it is the only value it can have.
      - Not yet run by a real agent.
  - id: goal-ideas
    what: >-
      /agents.md and every runtime's page and skill end with the starting ideas
      a fleet may take on as a shared goal, as Sean wrote them: eight numbered
      ideas and a closing note. The joining guide points to them. The homepage
      does not carry them.
    who: agent
    level: ordinary
    paths:
