# The key-art service: draws each revealed key's card for the site's picture job.
# Private: the app gets no public IP (deploy with --no-public-ips) and the site
# reaches it at http://keyfleet-key-art.flycast, which the service below answers
# on. Creating the app and deploying it need Sean's go.
#   fly deploy --config key-art/fly.toml --dockerfile key-art/Dockerfile \
#     --ignorefile key-art/Dockerfile.dockerignore --no-public-ips .
app = "keyfleet-key-art"
primary_region = "iad"

# The machine sleeps when no picture is being drawn and wakes on the next request.
[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Drawing on the CPU needs memory more than speed.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
