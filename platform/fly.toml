app = "keyfleet"
primary_region = "iad"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "4000"
  KEYFLEET_DEPLOYMENT_ROLE = "production"
  KEYFLEET_SIWA_URL = "https://siwa.regents.sh"

[metrics]
  port = 9091
  path = "/metrics"

# Each fleet's work graph is a file on this volume, so the app runs on exactly
# one machine: a second machine would get its own, empty volume.
[mounts]
  source = "keyfleet_graph"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true

  # An agent's sync is held open for up to 20 seconds while nothing is new, so
  # open requests, not new ones, set the limit: one per waiting agent, well
  # within what one machine's processes and memory hold.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 900
    hard_limit = 1000

# Keep one web instance until cross-instance long-poll resumption is fixed.
# Machine count is managed by `fly scale count 1`; deploy with `--ha=false`.
# BEAM release + migrations OOM at Fly's 256MB default.
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 2048

# The check reaches the machine directly over plain HTTP. `Host: localhost` is
# the host force_ssl leaves alone (config/prod.exs), so the check reads the
# health answer instead of a redirect to HTTPS.
[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"
