[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [
  { access = "read", path = "./deployments" },
  { access = "write", path = "./deployments/anvil.deployed.json" },
  { access = "write", path = "./deployments/base.deployed.json" },
  { access = "read-write", path = "./deployments/base-fork-lab.json" },
  { access = "write", path = "./deployments/safe" },
  { access = "read", path = "./broadcast/DeployKeyfleets.s.sol" },
  { access = "read", path = "./broadcast/BaseForkLab.s.sol" },
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
# Forge 1.8.6 runs each top-level call as a transaction of its own unless told not to, and that
# reaches `forge script` too. The deploy, Safe-step, record and lab scripts keep running as they
# always have, with it off.
isolate = false

[fmt]
ignore = ["src/vendor/**"]
