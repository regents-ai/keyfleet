\* A reading is fresh for 1 tick, the record may trail by under 2 ticks, a shard lasts 4 ticks
\* (longer than the fresh window, so the window is what ends a shard's rights).
\* A's person has put it on k2. Either Key may go to any wallet, the person's other one included.
\* NothingAfterRecordedEnd (open finding F1, the shard side) and NothingAfterChainEnd (the
\* reading's lag) break here; run.sh checks each on its own.
CONSTANTS
  S = 1
  B = 2
  Life = 4
  MaxTime = 5
  ReadsAll = FALSE
  Writes = TRUE
  Placed = TRUE
  Movable = {"k1", "k2"}
  MoveTo = {"O1", "O2", "O3"}
  Broken = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ShardOnlyForItsKey
INVARIANT NothingAfterExpiry
INVARIANT NothingAfterRecordedMove
INVARIANT PlacementEndsWithRecordedMove
INVARIANT EndsWithinFreshWindow
INVARIANT PairedOnlyWithoutShardOrPlace
