\* Chart: the shard alone; each reading records everything pending; a reading is fresh only in its own tick; a shard lasts two ticks.
\* The chart leaves the agent's write and its place on k2 out, so its rules are checked in ShardLife.cfg, not here.
CONSTANTS
  S = 0
  B = 1
  Life = 2
  MaxTime = 2
  ReadsAll = TRUE
  Writes = FALSE
  Placed = FALSE
  Movable = {"k1"}
  MoveTo = {"O2"}
  Broken = "none"
SPECIFICATION Spec
INVARIANT TypeOK
