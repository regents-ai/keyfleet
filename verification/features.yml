      - live: KeyfleetWeb.ShellLive
    proofs:
      - platform/test/keyfleet_web/live/proposals_page_test.exs
      - platform/assets/test/countdown.test.ts
    gaps:
      - Checked by eye in headless Chromium at 1280 and 390, light and dark; WebKit is not run on the Mac.

  - id: proposal-key-votes
    what: >-
      A proposal's page lists every Key by its vote, Yes, No and Abstain from
      each Key's latest vote, and Not voted for the Keys present when it opened
      that have not voted, each Key leading to its page.
    who: person
    level: ordinary
    paths:
