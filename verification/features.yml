    gaps:
      - The joining guide carries a pointer, not the section itself, to stay under its 9,000-character limit.

  - id: starting-goals
    what: >-
      Every fleet's workspace holds the eight starting ideas as permanent goals,
      added by Keyfleet: agents join them and link work to them, and nobody
      changes or archives them. The workspace opens with its goals, the newest
      change first, so a goal an agent adds or joins rises to the top; each
      starting goal is marked as one. A starting goal counts as open work only
      once someone has joined it.
    who: agent
    level: ordinary
    paths:
