      - platform/lib/keyfleet_web/refusal.ex
      - platform/lib/keyfleet_web/router.ex
      - platform/contracts/api-contract.openapiv3.yaml
      - platform/priv/tool_manifest.json
      - platform/priv/public/skill.md
      - platform/priv/public/docs.md
      - platform/priv/public/llms.md
      - platform/priv/public/agents.md
      - cli/commands.json
    entry:
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/create
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/list
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/read
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/add
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/write
    proofs:
      - platform/test/keyfleet_web/agent_notebook_files_test.exs
      - platform/test/keyfleet_web/signed_agent_contract_test.exs
      - platform/test/keyfleet_web/api_contract_test.exs
    gaps:
      - Proven against a local hub that keeps files as the real one does and, like Fly's private addresses, answers only on IPv6 by name; not yet run against a real notebook host.
      - While someone has the notebook open in a live session, adding and writing answer 409; the log is read through a run's page.
      - Not yet run by a real agent.

  - id: release-without-gap
    what: >-
      A release of keyfleet.ai answers every page throughout. The site machine
      takes a release bluegreen, the new one answering before the old one
      stops, while the graph machine, which keeps the fleets' graph logs on its
      volume, stops and starts again; for those seconds a workspace write
      answers "try again" and nothing is written twice. A workspace write on the
      site machine is made by its fleet's writer on the graph machine.
    who: person
    level: protected
    paths:
      - platform/fly.toml
      - platform/fly.staging.toml
      - platform/rel/env.sh.eex
      - platform/rel/overlays/bin/site
      - platform/rel/overlays/bin/graph
      - platform/Dockerfile
      - platform/config/runtime.exs
      - platform/config/prod.exs
      - platform/lib/keyfleet/application.ex
      - platform/lib/keyfleet/graph/writer.ex
      - platform/lib/keyfleet/graph/projector.ex
      - platform/lib/keyfleet/graph/projectors.ex
      - platform/lib/keyfleet/graph/supervisor.ex
      - scripts/deploy.sh
      - scripts/release.sh
    entry:
      - route: GET /healthz
    proofs:
      - platform/test/keyfleet/graph/cluster_test.exs
      - platform/test/keyfleet/graph/writer_test.exs
      - platform/test/keyfleet/runtime_config_test.exs
      - scripts/release.sh
    gaps:
      - The two-step release was tried on a throwaway Fly app with a stand-in server, not yet on keyfleet.ai.
      - For the minute a site release takes, two site machines run, so announcements from other Regent sites reach open pages twice.

  - id: notebook-makers-only
    what: >-
      Members open, copy and run each other's work on a fleet's notebook host,
      and only whoever made a thing changes, removes or stops it: a notebook,
      a session, a job, a run, a workspace file or folder, or a saved result.
      Anyone else is refused and nothing changes. Opening someone else's
      notebook to edit gives a sandbox of one's own that saves nothing back. A
      Key whose edits a fleet vote has restricted only reads, and its open
      notebook connection closes when the vote passes.
    who: person
    level: protected
    paths:
      - platform/lib/keyfleet_web/plugs/notebook_gateway.ex
      - platform/lib/keyfleet_web/notebook_socket.ex
      - platform/lib/keyfleet/notebooks/makers.ex
      - platform/lib/keyfleet/notebooks/file_maker.ex
      - platform/lib/keyfleet/notebooks/runs.ex
      - platform/lib/keyfleet/notebooks.ex
      - platform/lib/keyfleet/graph/checks/key_actor.ex
      - platform/lib/keyfleet_web/refusal.ex
      - notebook-hub/hub/fleets/fleet-tech-classic.hub.toml
      - notebook-hub/hub/fleets/regents-club.hub.toml
    entry:
      - route: "* https://FLEET.notebooks.keyfleet.ai/api/v1/projects/{project_id}/notebooks/{notebook_id}"
      - route: DELETE https://FLEET.notebooks.keyfleet.ai/results/{notebook_id}/{source_id}/{saved_at}
    proofs:
      - platform/test/keyfleet_web/notebook_gateway_test.exs
      - platform/test/keyfleet_web/agent_notebook_files_test.exs
    gaps:
      - Proven against a local hub; the sandbox for non-makers is the notebook host's own setting, checked on the real host after release.
      - A saved result whose run the hub no longer keeps can't be removed by anyone.
      - Files a run writes have no maker kept, so they are the notebook's maker's.
