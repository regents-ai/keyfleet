      - A newly paired agent reaches an open menu through the database's change notice, which the tests send by hand.

  - id: sign-in-choices
    what: >-
      A visitor signs in with any way turned on for Regents in Privy: email, a
      text message, Google and the other social accounts, or a wallet. Someone
      who signs in without a wallet gets a Privy wallet at once, and the site
      signs them in when it is ready. Google brings the person back to the page
      they started on, where the sign-in finishes. Sign-in started from inside a
      window, such as Buy in the Buy Key window or over a Key's page, can be
      used above every window; closed without signing in, the windows are back
      above the page as they were, ready to press again.
    who: person
    level: protected
    paths:
      - platform/assets/js/privy_bridge.tsx
      - platform/assets/js/auth_lazy.ts
      - platform/assets/js/hooks/modal_dialog.ts
    entry:
