  - id: wallet-network-switch
    what: >-
      A person presses a wallet button while their wallet is on another
      network, and their wallet asks to switch to Base through Privy's own
      switch, which also adds Base to a wallet app that lacks it; Privy's own
      wallet moves at once through the provider the page holds. Once the
      wallet answers the switch request, the same press sends or signs: the
      page reads neither the network nor the wallet's account again to refuse
      it, and the step carries Base's chain id. A press the server has built
      steps for reaches the wallet open when it was pressed, with the step as built, and every
      press off Base asks again; nothing is remembered or held back. Privy connects every wallet on Base and offers
      no other network. A declined switch sends nothing and leaves "Press
      again to switch your wallet to Base. Nothing was sent." Any other failed
      switch sends nothing and leaves "Your wallet couldn't switch to Base.
      Switch it in your wallet app, then press again. Nothing was sent."
      When the page loses its connection and gets it back, as at a release,
      the page tells the server the open wallet again with nothing pressed, so
      its wallet buttons work again without a reload. A press that asks the
      server for its steps names the open wallet, so one made while the page
      is still getting its connection back is built for that wallet too, when
      the account links it, outside the Buy Key window. Each press sends
      through the wallet open when it was pressed, even when another opens
      before its steps come back.
    who: person
    level: protected
    paths:
      - platform/assets/js/wallet_actions/send_step.ts
      - platform/assets/js/hooks/onchain_steps.ts
      - platform/assets/js/hooks/account_wallets.ts
