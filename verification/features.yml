  - id: treasury-refresh
    what: >-
      A fleet's Treasury figures follow what is done on its page: once a step
      sent from the fleet's page goes through, the treasury's balances are read
      at once, its history ten seconds later, and the figures beside its other
      buttons are read again. Otherwise the chain is read every five minutes.
      The read-again icon beside "Updated" reads the balances at once too; each
      person may press it once every 30 seconds (by account, or by visit when
      signed out), and it rests dimmed until then.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/proposals_live.ex
      - platform/lib/keyfleet_web/live/treasury_live.ex
      - platform/lib/keyfleet_web/live/shell_live.ex
      - platform/lib/keyfleet_web/wallet/wallet_panel.ex
