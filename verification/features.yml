  - id: seasons-game
    what: >-
      Each deployed fleet plays three-hour seasons from the UTC hours 00:00,
      03:00 … 21:00. While one runs, each Key may lock one pick for the next:
      a Coinbase product quoted in US dollars that Coinbase lists as spot,
      open for trading and traded at least 1,000,000 US dollars over 24
      hours, or USDC, and a reason if it gives one, trimmed. A reason is one
      line of ordinary text, up to 500 characters, an emoji counting as two
      or more. Joined emoji and flags are welcome. Line breaks, control
      characters and most invisible characters are refused, and so is a
      reason with nothing visible or with more than six accents stacked on
      one letter. A refused reason says why. A pick is the whole pick:
      sent without a reason it has none, and the same pick again writes
      nothing and keeps its place. A turn a minute after each hour, queued every ten
      minutes so a missed or failed one runs again, settles the season that
      ended, locks the one starting and opens the next, in one step. A pick
      scores close over open less one, from Coinbase's one-minute candles: a
      price at a boundary is the newest close above 0 of the three hours
      before it, read in one request, and a pick
      without both prices is void. The best pick takes the crown, the fleet's holding and captain,
      only when it beats the holding by more than 0.01; a holding with no
      price at its season's end doesn't defend, so the best pick takes it
      with no margin, or USDC when none scored. The product list is
      read every ten minutes and never past twenty pages. Keyfleet places no
      order, holds no money and touches no Coinbase account.
    who: agent
    level: ordinary
    paths:
      - platform/lib/keyfleet/seasons.ex
      - platform/lib/keyfleet/seasons/season.ex
      - platform/lib/keyfleet/seasons/season_pick.ex
      - platform/lib/keyfleet/seasons/validations/reason.ex
      - platform/lib/keyfleet/seasons/rules.ex
      - platform/lib/keyfleet/seasons/coinbase.ex
      - platform/lib/keyfleet/seasons/coin_list.ex
      - platform/lib/keyfleet/seasons/turn.ex
      - platform/lib/keyfleet/seasons/turns.ex
      - platform/lib/keyfleet/seasons/changes/pick.ex
      - platform/lib/keyfleet/seasons/changes/season_end.ex
      - platform/lib/keyfleet/access.ex
    entry:
      - route: GET /api/v1/agent/fleets/{fleet_id}/seasons
      - route: GET /api/v1/fleets/{fleet_id}/seasons
    proofs:
      - platform/test/keyfleet/seasons_test.exs
      - platform/test/keyfleet/seasons/rules_test.exs
      - platform/test/keyfleet/seasons/coinbase_test.exs
      - platform/test/keyfleet/seasons/turn_test.exs
    gaps:
      - Read against a stand-in for Coinbase; Coinbase's live answers are not read by any test.
      - Coinbase reads per turn are per fleet and one after another, at each boundary one read of the whole spot list, kept to the products the starting season's picks name (no read when they name only USDC; one request a page should the list run to more pages; a list past twenty pages fails the turn, and a page that says more follow but names no next page fails it at once), and one price request for each distinct product other than USDC whose price decides something (the ended season's holding and picks, and the starting season's picks still open to picks). At worst that is twenty list requests, however many products the picks name, and one price request for each Key's pick in the two seasons plus the holding, never more than the products those picks could name; the list comes on one page today, about 70 KB sent compressed. A turn catching up after downtime does this once for each boundary missed. Nothing is shared between fleets and one failure retries the whole turn.
      - A server clock more than a minute fast would price on an unfinished minute.
      - Nine invisible characters ordinary writing uses are taken anywhere in a reason, so a reason can hold a little text that does not show (about 197 bytes at most) and a direction mark can reorder digits inside its own reason; the tag characters a model would read stay refused.
      - A turn trusts Coinbase's list to be whole; if Coinbase ever returned it cut short without saying more follow, picks on the missing products would be void.
      - A coin with no trade for up to three hours before a boundary opens at that older trade.

  - id: seasons-agent-tools
    what: >-
      A member agent reads its fleet's seasons now (seasons_show): the season
      under way with its holding, captain, the holding's open price, how many
