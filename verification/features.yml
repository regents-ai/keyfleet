  - id: claude-connector
    what: >-
      With KEYFLEET_CLAUDE_CONNECTOR_ENABLED on, a person adds the Keyfleet
      connector in Claude with the address /mcp, signs in to Keyfleet when
      Claude asks and allows one permission; Claude then keeps an identity of
      its own for that app, pairs it with the person's one-use code as `claude`
      and checks in, which
      sets its last contact on Account (not its check-in light), and the person
      can disconnect it from Connected apps. An app's identity is keyed by the
      account and the app's sign-in: an app that signs in by its published
      identity is the same identity at every connection to that account, and
      one registered here is a new identity each time it registers. Each
      identity pairs only with its own code, so
      another app never takes its pairing. Disconnecting ends an app's tokens,
      not its pairing, which only Unpair on the Agents page ends. Allow and
      Cancel answer a page that leads back to the app's own callback, carrying a state of any length that fits
      the 2,048 bytes allowed for the whole sign-in request. /mcp is the shared
      RegentMCPAgents.Plug: 401 with the sign-in challenge without a live
      token, 120 requests a minute per connected account; before that a
      request with a token counts against the connector's own ceiling of
      6,000 a minute for the address it comes from, which every person's
      Claude calling from those servers shares, and one without a token
      against that address's /api budget of 120 a minute, shared with
      everything else it sends there. 405 for anything but POST, Keyfleet's
      own refusal words. Tokens are stored only as their hash. An optional
      input sent as null at the top of a tool's input counts as left out; a
      null inside an input is sent as it is, and the tool's own rules decide
      (fleets_sync with graph.project or run.blocker null is refused; left
      out, taken). The signed request takes only what its published schema
      allows and refuses a null the schema has no null for. Claude's guide, its skill,
      its place on /agents and the sitemap, the pair request's
      `claude` harness and the lines in llms.txt and agents.md naming /mcp
      exist only while the switch is on; off, /agents/claude is not found and
      /mcp answers 404. Turning it on without the site's hosted signing key
      stops the boot, naming the setting. Off by default.
    who: agent
    level: protected
    paths:
      - platform/mix.exs
      - platform/config/config.exs
      - platform/config/runtime.exs
      - platform/lib/keyfleet/application.ex
      - platform/lib/keyfleet/oauth.ex
      - platform/lib/keyfleet_web/controllers/oauth_controller.ex
      - platform/lib/keyfleet_web/endpoint.ex
      - platform/lib/keyfleet_web/plugs/launch_gate.ex
      - platform/lib/keyfleet_web/router.ex
      - platform/lib/keyfleet_web/agent_guides.ex
      - platform/lib/keyfleet_web/public_documents.ex
      - platform/lib/keyfleet_web/plugs/mcp_agent.ex
      - platform/lib/keyfleet/agents/hosted_address.ex
      - platform/priv/public/agents/claude.md
      - platform/priv/public/llms.md
      - platform/priv/public/agents.md
      - platform/priv/repo/migrations/20261028180000_add_oauth_provider.exs
      - platform/priv/repo/migrations/20261119120000_oauth_long_values.exs
    entry:
      - route: POST /mcp
      - route: GET /oauth/authorize
      - route: POST /oauth/authorize
      - route: POST /oauth/token
      - route: GET /oauth/connections
      - route: GET /agents/claude
    proofs:
      - platform/test/keyfleet_web/router_gate_coverage_test.exs
      - platform/test/keyfleet_web/rate_limit_test.exs
      - platform/test/keyfleet_web/mcp_connector_test.exs
      - platform/test/keyfleet_web/oauth_consent_test.exs
    gaps:
      - The connector test runs /mcp through Keyfleet's endpoint with the hosted signer stubbed, so each app's own identity and its pairing are proven there, not against siwa-server. The library's own plug and hashed-token tests run in elixir-utils, not against Keyfleet.
      - Nothing checks the switch both ways - /agents/claude, its skill.md, /agents, the sitemap, llms.txt, agents.md and the pair request's `claude` harness with the connector on and off.
      - Nothing checks that runtime.exs stops the boot without SIWA_HOSTED_SIGNING_KEY, or that the issuer and resource follow PHX_HOST.
      - The first migration runs with every release since it reached main. 20261119120000 (the library's V4, which lifts the 255-character limit off a code's state and callback and off an app's name, callbacks and key address) has run only on test databases; while the graph machine runs it, the site machine still serving fails each sign-in query it prepared once on each database connection. The library binds each code and token to the running site's issuer and resource as it is issued (its own tests); nothing checks that on Keyfleet.
      - Consent, Allow, the code exchange, refresh and a tool list run through Keyfleet's own endpoint for ChatGPT's and Claude's published identities and for an app registered here, and Cancel for ChatGPT's (oauth_consent_test), with the browser session set directly rather than through Privy's sign-in. The return page is checked as an answer; no browser here follows it to another host. Disconnecting, an /mcp call with a revoked token, the 405 for a GET and a 401 when the account can't be read are unchecked on Keyfleet.
      - Pairing as `claude` and checking in through the hosted signer have never run against siwa-server; real Claude has never connected.
      - Whether real Claude signs in here by its published identity or registers as an app is not known: the site offers both, and the consent tests run both.
      - The connector's packages are pinned to elixir-utils `caba486c` (main). The in-process identity requests (RegentAgents.HTTP inside the /mcp request) have not run against siwa-server.
      - siwa-server (main, released through v104) limits what a hosted signer may sign (e9a822d) and lets it pair a Keyfleet identity only as `claude` (lib/siwa_server/hosted_requests.ex).
      - The browser walk does not open the Claude guide with the connector on; WebKit is not run on the Mac.
  - id: hello-cards
    what: >-
      Before the SIWA sign-in server gives an agent a hello card naming
      Keyfleet, it asks POST /api/agents/v1/pairing with its own service token
      for this site's address. A paired agent is answered with exactly its
      name, its person's shared profile code and when it paired; an agent not
      paired here 404 not_paired_here; a paired agent whose person has never
      signed in here with a wallet 409 person_has_no_profile; no token, or one
      for another site, another agent or an expired one, 401
      service_token_invalid. A card an agent shows in the x-siwa-hello-card
      header beside its own signed request, on the API or at /mcp, is kept on
      the request only when it passes for that agent's wallet; any other card
      is ignored and the request answered as without it. Nothing reads a kept
      card yet.
    who: agent
    level: ordinary
    paths:
      - platform/mix.exs
      - platform/config/config.exs
      - platform/config/runtime.exs
      - platform/lib/keyfleet/agents.ex
      - platform/lib/keyfleet_web/plugs/signed_agent.ex
      - platform/lib/keyfleet_web/router.ex
      - platform/priv/public/agents.md
      - platform/priv/public/docs.md
    entry:
      - route: POST /api/agents/v1/pairing
    proofs:
      - platform/test/keyfleet_web/hello_card_test.exs
    gaps:
      - siwa-server has never asked Keyfleet: the test publishes its own stand-in key and signs the service token itself. siwa-server asks the first address in its SIWA_WALLET_ORIGINS for Keyfleet, https://keyfleet.ai, which matches the address PHX_HOST gives the site.
      - Keyfleet reads the sign-in server's published keys to check a card beside a signed request (on the API, at /mcp and at whoami, me and pair) or a pairing question's token when it holds none read in the last hour, and may read them sooner for a key not among those it holds; otherwise it reuses the keys it holds. Keyfleet's tests do not check when they are read.
  - id: chatgpt-connector
    what: >-
      With the same switch on (KEYFLEET_CLAUDE_CONNECTOR_ENABLED, named for
      Claude, its first app), a person adds Keyfleet in ChatGPT as a custom
      MCP server with the address /mcp, signs in to Keyfleet when ChatGPT asks
      and presses Allow once. Keyfleet takes any app's published identity
      that passes its checks, read from the address the app names; one that
      declares private_key_jwt, the shape the sign-in library describes for
      ChatGPT's, has its code exchange and each refresh signed with the app's
      own key. The tests serve
      a stand-in identity for ChatGPT at https://chatgpt.com/oauth/client.json.
      ChatGPT's identity pairs with the person's one-use
      code as `chatgpt`, through the same /mcp, sign-in, tools and limits as
      Claude, and Disconnect ends ChatGPT's tokens, not the pairing. The
      pairing box offers ChatGPT with its own setup words, and its guide at
      /agents/chatgpt, its skill and its place on /agents and the sitemap
      exist only while the switch is on. The guide ends with Coinbase's own app in the same
      ChatGPT: it follows the fleet's holding in the person's own Coinbase
      account, which Keyfleet never sees or touches.
