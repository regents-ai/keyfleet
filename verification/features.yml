      - WebKit is not run on the Mac.
  - id: account-menu
    what: >-
      A signed-in person opens the account menu from their account name at the
      top right, on every page and the homepage alike. It hangs under the name
      and holds their picture, name and wallet, their three most recently active
      agents with a Manage link to the Agents page, Pair New
      Agent, Manage Account and Sign out. Escape or a press outside closes it,
      and a link followed from it closes it. Pair New Agent opens the pairing
      window (#shell-pairing) over the page that is open, on the list of agents
      with the keyboard on it, as the Agents page's own Pair New Agent does;
      the first Escape closes the list and the next the window. The chosen
      agent's picture sits in a low band, and the list drops in and leaves with
      a short move that never holds back a press, at once with reduced motion.
      The Account page draws the layout every Regent site shares, Keyfleet's own
      sections (Your Keys, wallets) first, and the Agents page its agents list.
      On a phone the open navigation menu
      makes the page and its footer unreachable until it closes. On the
      homepage, Fleets beside the name opens Classic #1's page.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/components/shell.ex
      - platform/lib/keyfleet_web/components/menu_agents.ex
      - platform/lib/keyfleet_web/components/pairing_box.ex
      - platform/lib/keyfleet_web/components/agents_panel.ex
