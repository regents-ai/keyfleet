      - platform/priv/public/skill.md
      - platform/priv/public/docs.md
      - platform/priv/public/llms.md
      - platform/priv/public/agents.md
      - cli/commands.json
    entry:
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/create
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/list
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/read
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/add
      - route: POST /api/v1/agent/fleets/{fleet_id}/notebooks/{notebook_id}/files/write
      - route: GET /api/v1/agent/fleets/{fleet_id}/projects/{project}/notebooks/{notebook_id}/page
    proofs:
      - platform/test/keyfleet_web/agent_notebook_files_test.exs
      - platform/test/keyfleet/notebooks/page_test.exs
      - platform/test/keyfleet_web/signed_agent_contract_test.exs
      - platform/test/keyfleet_web/api_contract_test.exs
    gaps:
      - Proven against a local hub that keeps files as the real one does and, like Fly's private addresses, answers only on IPv6 by name; not yet run against a real notebook host.
      - While someone has the notebook open in a live session, adding and writing answer 409; the log is read through a run's page.
      - A write names the revision it read and a stale one answers 409 stale_revision; proven here against a stand-in hub that enforces If-Match, and the hub's own check by notebook-hub/local/drive.mjs against the real patched hub image.
      - A finished run's entry_current and bundle_current are proven here against a stand-in hub that lists every file with the ETag its read answers, as workspace-listing.patch makes the real hub do; the hub's own listing is checked by notebook-hub/local/drive.mjs.
      - The notebooks list (POST .../projects/{project}/notebooks/list) pages 50 at a time, newest first, with cursor and has_more; proven here against a stand-in hub that pages its notebooks by cursor as the hub does, not yet against a real notebook host.
      - Each listed notebook's state is its newest kept run page, whoever ran it, read from Keyfleet's copies alone; changed_since compares the hub's updated_at, which marimohub 626ec14 moves on a change to the notebook's code, packages or details but not its other files. Proven here against a stand-in hub; a copy kept before failures were recorded answers error null until its run is read again.
      - A notebook's page (GET .../notebooks/{notebook_id}/page) answers its newest kept run page's cells, read from the marimo session inside the page; proven against pages marimo 0.25.2 exported, kept as fixtures, and a stand-in hub, not yet against pages from the real notebook host's marimo.
      - Two run starts sent at once with one idempotency_key start one run, as run-start-once.patch makes the hub do; proven by the hub's own routes/jobs.test.ts, not against a deployed hub. Before the agent's first run of a notebook has answered, two sent at once can each make a job and start a run in it: the hub's job creation holds no claim.
      - Not yet run by a real agent.

  - id: shared-projects-and-notebook-locks
    what: >-
      Every fleet has projects no Key holds: the fleet's Collaborative
      Understanding, with a "Fleet understanding" page every member edits, and,
      in every fleet but Regents Club, the Append-only scratchpad, with a
      notebook "Key N" for each sold Key, written by whoever acts as that Key.
      No Key archives, takes over or deletes them. A notebook starts locked; its maker unlocks it to let every
      member edit it, and only its maker locks it again or deletes it. Once a
      day every changed notebook is copied and each copy kept 90 days; anyone
