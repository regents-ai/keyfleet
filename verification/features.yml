  - id: account-wallets
    what: >-
      A signed-in person sees their wallets in the side panel and on the Account
      page's Profile and Wallets tab, each with a copy icon and a Basescan arrow.
      Once their browser says so, each is named "Your wallet" or "Regents wallet"
      (the one Privy made at sign-in), and the active wallet is marked "Active".
      Signed in, only the account's own wallets show and only one of them can be
      active: a wallet app left connected from before a Google sign-in is never
      shown or used, and Sign out lets go of every wallet in Privy before Privy
      signs out. Showing and copying only: nothing here signs or changes a wallet.
