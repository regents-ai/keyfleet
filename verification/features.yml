repo: keyfleet
# Started with the homepage's moving parts. Every other part of Keyfleet is not
# mapped yet; each change maps what it touches first.
features:
  - id: home-fleet-seas
    what: >-
      A visitor sees Classic's and the Regents Club's seas on the homepage, a ship
      for each of the fleet's most recently active Keys, and pressing a ship opens
      that Key on the fleet's page. Every open homepage shares one reading of each
      fleet's ships. By night the seas are dark charcoal with pale grey lines.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/lib/keyfleet_web/fleet_ships.ex
      - platform/lib/keyfleet_web/harbour_crew.ex
      - platform/lib/keyfleet/shared_reading.ex
      - platform/lib/keyfleet/application.ex
      - platform/config/config.exs
      - platform/assets/js/canvas_island.ts
      - platform/assets/js/hooks/harbour_sea.ts
      - platform/assets/js/harbour/**
      - platform/priv/static/images/home/sea-*.webp
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/test/keyfleet_web/home_live_test.exs
      - platform/test/keyfleet_web/fleet_ships_test.exs
      - platform/assets/test/canvas_island.test.ts
    regressions:
      - id: R-20261019-home-ships-shared
        from: Sentinel read of 9b93fe1b
        test: platform/test/keyfleet_web/home_live_test.exs
      - id: R-20261019-strained-sea-recovers
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/canvas_island.test.ts
      - id: R-20261019-wall-removal-reads-again
        from: breaker review of the fixes to 9b93fe1b
        test: platform/test/keyfleet_web/fleet_ships_test.exs
    gaps:
      - The seas' drawing is checked in headless Chromium at 390 and 1280; WebKit is not run on the Mac.
      - A sea asked to hold still on a slow device is given another chance only when the tab is shown again.

  - id: home-key-cards
    what: >-
      A visitor sees thirty Key cards turning over in Classic's section and in
      the Buy Key window, a fifth of a second each, only while they are on
      screen. The Regents Club's section has none; it shows its public page
      and its Keys on OpenSea, even while it is coming soon.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/assets/css/pages/home.css
      - platform/assets/js/hooks/key_cards.ts
      - platform/assets/js/app.ts
      - platform/priv/static/images/home/key-cards.webp
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/assets/test/key_cards.test.ts
      - platform/test/browser/homepage_details.spec.ts
      - platform/test/keyfleet_web/home_live_test.exs
    regressions:
      - id: R-20261019-cards-rest-off-screen
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/key_cards.test.ts
    gaps:
      - WebKit is not run on the Mac.
      - The browser checks run with Classic's sale closed, so the Buy Key window's cards are checked in the server tests only.

  - id: home-hero-field
    what: >-
      Under a mouse, the hex field behind the homepage's hero raises the tiles
      nearest it, lights a wake and sends a ring out on a press; phones, tablets
      and less motion see the still drawing.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/assets/css/pages/home.css
      - platform/assets/js/canvas_island.ts
      - platform/assets/js/hooks/home_hero.ts
      - platform/assets/js/home_hero/**
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/assets/test/home_field_renderer.test.ts
      - platform/assets/test/canvas_island.test.ts
      - platform/test/browser/homepage_details.spec.ts
    regressions:
      - id: R-20261019-field-build-not-lost
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/home_field_renderer.test.ts
      - id: R-20261019-failed-start-lets-go
        from: Sentinel read of 9b93fe1b
        test: platform/assets/test/canvas_island.test.ts
    gaps:
      - The raised tiles, wake and ring are checked by hand in headless Chromium at 1280; the still drawing under a finger at 390 is checked in the repo. WebKit is not run on the Mac.

  - id: home-next-key
    what: >-
      On a wide screen the homepage's headline takes the hero's left half and the
      next Key's card, with "Buy Next Key", sits in the middle of its right half.
      Under a mouse the card turns toward the pointer and settles level again.
      Dust gathers just outside the card's edge on the side facing the mouse,
      brighter the nearer it is; pointing at the card or the button flashes the
      card into a looping shuffle of a hundred real Keys at ten a second, which
      dissolves back to the pass over half a second when the mouse leaves. Less
      motion and a finger get the pass as it is, with no dust and no shuffle.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/assets/css/pages/home.css
      - platform/assets/js/hooks/home_hero.ts
      - platform/priv/static/images/home/next-key-shuffle.webp
      - key-art/shuffle.mjs
      - key-art/page/shuffle.ts
    entry:
      - route: GET /
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/test/browser/homepage_details.spec.ts
    regressions:
      - id: R-20261019-card-keeps-no-turn
        from: Sentinel read of ff1146e1
        test: platform/test/browser/homepage_details.spec.ts
    gaps:
      - WebKit is not run on the Mac.
      - The shuffle's picture is about 1.9 MB; it loads only under a mouse, once the dust shows.

  - id: header-footer-links
    what: >-
      Every link and button in the site header and footer has a name and is at
      least 44 pixels square under a finger, on a touch phone and tablet, the X
      and GitHub marks included. Under a mouse they keep the design system's own
      sizes.
    who: person
    level: ordinary
    paths:
      - platform/lib/keyfleet_web/components/shell.ex
      - platform/lib/keyfleet_web/components/layouts.ex
      - platform/lib/keyfleet_web/components/regent_links.ex
      - platform/assets/css/app.css
      - platform/assets/css/pages/home.css
    entry:
      - route: GET /
    proofs:
      - platform/test/browser/homepage_details.spec.ts
    regressions:
      - id: R-20261019-links-fit-a-finger
        from: Sentinel read of ff1146e1
        test: platform/test/browser/homepage_details.spec.ts
    gaps:
      - Measured on the homepage only; the header and footer are the same on every page.

  - id: goal-ideas
    what: >-
      The homepage ends with the starting ideas a fleet may take on as a shared
      goal, as Sean wrote them: eight numbered ideas and a closing note, each
      link to another site opening in a new tab. The agents' Markdown homepage,
      /agents.md and every runtime's page and skill end with the same section,
      and the joining guide points to it.
    who: anyone
    level: ordinary
    paths:
      - platform/priv/public/goal-ideas.md
      - platform/lib/keyfleet/goal_ideas.ex
      - platform/lib/keyfleet_web/live/home_live.ex
      - platform/assets/css/pages/home.css
      - platform/priv/public/agents.md
      - platform/priv/public/skill.md
      - platform/lib/keyfleet_web/public_documents.ex
      - platform/lib/keyfleet_web/agent_guides.ex
      - platform/lib/keyfleet_web/controllers/agent_files_controller.ex
    entry:
      - route: GET /
      - route: GET /agents.md
      - route: GET /agents/:agent
      - route: GET /agents/:agent/skill.md
      - live: KeyfleetWeb.HomeLive
    proofs:
      - platform/test/keyfleet_web/home_live_test.exs
      - platform/test/keyfleet_web/controllers/agent_files_test.exs
      - platform/test/browser/homepage.spec.ts
    gaps:
      - WebKit is not run on the Mac.
      - The joining guide carries a pointer, not the section itself, to stay under its 9,000-character limit.
